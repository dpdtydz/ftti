name: Fixed Time Newsletter Cron

on:
  schedule:
    # 1. UTC 23:00 (한국 오전 8시)
    # 2. UTC 01:00 (한국 오전 10시)
    - cron: '0 23,1 * * *'
  workflow_dispatch: # 필요할 때 수동으로 실행 가능

jobs:
  run-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel API (8AM)
      if: github.event.schedule == '0 23 * * *'
      run: |
        curl -X GET "https://ftti-umber.vercel.app/api/cron/send-newsletters?time=08:00" \
        -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
    
    - name: Call Vercel API (10AM)
      if: github.event.schedule == '0 1 * * *'
      run: |
        curl -X GET "https://ftti-umber.vercel.app/api/cron/send-newsletters?time=10:00" \
        -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
